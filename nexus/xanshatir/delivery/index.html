<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Xan Shatir — Yetkazib berish · Доставка, Chirchiq</title>
<meta name="description" content="Xan Shatir restorani taomlarini uyingizga buyurtma qiling: beshbarmoq, manti, shashlik, salatlar. Chirchiq bo'ylab yetkazib berish.">
<meta name="theme-color" content="#062a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../fa/all.min.css">
<style>
:root{--green:#0a5a36;--green-dk:#062a1a;--gold:#D4AF37;--gold-lt:#F3E5AB;--gold-dk:#997A15;--bg:#04140c;--panel:rgba(10,40,26,.82);--panel2:#0a281a;--text:#fff;--muted:#9fb2a7;--line:rgba(212,175,55,.2);--good:#3ddc84;--bad:#ff8a80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse 120% 50% at 50% -10%,rgba(10,90,54,.75),transparent 60%),radial-gradient(ellipse 80% 40% at 100% 100%,rgba(153,122,21,.14),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.gold{background:linear-gradient(110deg,var(--gold-dk),var(--gold) 30%,var(--gold-lt) 50%,var(--gold) 70%,var(--gold-dk));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(4,20,12,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{display:block;width:42px;height:42px}
.brand b{font:700 17px 'Cinzel',serif;letter-spacing:.06em}
.brand small{display:block;font:600 10px 'Space Grotesk';letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{font:600 11px 'Space Grotesk';padding:6px 10px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--gold);color:#0b0b0b}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--gold);color:#0b0b0b;font-weight:700;font-size:14px}
.cartbtn em{font-style:normal;min-width:20px;height:20px;border-radius:99px;background:#062a1a;color:var(--gold-lt);font:700 11px/20px 'Space Grotesk';text-align:center;padding:0 5px}
.cartbtn em:empty{display:none}
@media (max-width:560px){.cartbtn span{display:none}.brand small{letter-spacing:.12em}}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:38px 0 10px}
.hero em{font:600 11px 'Space Grotesk';letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-style:normal}
.hero h1{font:700 clamp(32px,5vw,54px)/1.08 'Playfair Display',serif;margin:10px 0 12px}
.hero p{color:#cfe0d6;max-width:480px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:#d7e2dc}
.chips i{color:var(--gold)}
.hero .ph{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 30px 70px -20px #000,0 0 0 10px rgba(212,175,55,.08);max-width:400px;justify-self:center;width:100%}
.hero .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph b{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;padding:8px 14px;border-radius:999px;background:rgba(4,20,12,.85);border:1px solid var(--gold);font:600 13px 'Space Grotesk';color:var(--gold-lt)}
.closed{display:none;margin-top:16px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,138,128,.4);background:rgba(255,138,128,.08);color:#ffd2cc;font-size:14px}
.closed.on{display:block}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:24px;text-align:center}.hero p{margin:0 auto}.chips{justify-content:center}.hero .ph{max-width:240px;grid-row:1}
  .hero .ph b{bottom:12px;padding:6px 10px;font-size:11px}}

/* menu */
.tabs{position:sticky;top:64px;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:14px 16px;margin:18px -16px 0;background:linear-gradient(var(--bg) 78%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:500;color:#cfe0d6}
.tabs button i{color:var(--gold);font-size:12px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#0b0b0b}
.tabs button.on i{color:#0b0b0b}
.cat{scroll-margin-top:130px}
.cat h2{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font:700 24px 'Playfair Display',serif}
.cat h2 i{font-size:16px;color:var(--gold)}
.cat h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.dish{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.dish .im{position:relative;aspect-ratio:4/3;background:radial-gradient(circle at 35% 30%,#16704a,#062a1a 80%);display:grid;place-items:center;color:var(--gold);font-size:34px}
.dish .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish .im b{position:absolute;left:10px;top:10px;font:700 10px 'Space Grotesk';letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--gold);color:#0b0b0b}
.dish .bd{flex:1;display:flex;flex-direction:column;padding:12px 13px 13px}
.dish h3{font-size:15px;font-weight:600;line-height:1.25}
.dish p{font-size:12.5px;color:var(--muted);margin-top:3px}
.dish .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.dish .ft span{font:700 15px 'Space Grotesk';color:var(--gold-lt)}
.dish .ft small{display:block;font:400 11px 'Inter';color:var(--muted)}
.ask{font-size:12px;color:var(--muted)}
.dish .pk{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.sum .pkn{margin-top:-2px;font-size:12px;color:var(--muted)}
.sum i{color:var(--gold);margin-right:6px;font-size:12px}
.sum .geo{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin:2px 0 4px;padding:10px;border-radius:12px;border:1px solid var(--gold);background:rgba(212,175,55,.08);color:var(--gold-lt);font-size:13px;font-weight:600}
.add{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0b0b0b;display:grid;place-items:center;font-size:13px;transition:transform .15s}
.add:active{transform:scale(.9)}
.qty{flex:none;display:flex;align-items:center;border-radius:999px;border:1px solid var(--gold);background:rgba(4,20,12,.7)}
.qty button{width:30px;height:32px;display:grid;place-items:center;font-size:12px;color:var(--gold)}
.qty b{min-width:18px;text-align:center;font:600 13px 'Space Grotesk'}
@media (max-width:420px){.dish .ft{flex-wrap:wrap}.dish .ft span{font-size:14px}}

.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:40px 0 0}
.info div{padding:18px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.info i{font-size:20px;color:var(--gold)}
.info b{display:block;margin:8px 0 2px;font:700 17px 'Playfair Display',serif}
.info p{font-size:13px;color:var(--muted)}
@media (max-width:720px){.info{grid-template-columns:1fr}}
footer{margin-top:36px;padding:26px 0 120px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--gold-lt)}
footer .made{display:block;margin-top:8px;font-size:12px}
footer .made b{font:700 12px 'Space Grotesk';letter-spacing:.2em}

/* floating cart bar (phones) */
.bar{position:fixed;left:50%;bottom:14px;z-index:8;width:calc(100% - 28px);max-width:520px;transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:20px;background:var(--gold);color:#0b0b0b;box-shadow:0 18px 40px -10px rgba(0,0,0,.6)}
.bar.on{transform:translate(-50%,0)}
.bar div{flex:1;line-height:1.2}
.bar small{display:block;font-size:12px;opacity:.75}
.bar b{font:700 17px 'Space Grotesk'}
.bar button{padding:11px 16px;border-radius:14px;background:#062a1a;color:var(--gold-lt);font-weight:600;font-size:14px}

/* cart + checkout drawer */
.shade{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(440px,100%);display:flex;flex-direction:column;background:#06281a;border-left:1px solid var(--gold);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.dh h3{flex:1;font:700 22px 'Playfair Display',serif}
.dh button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.db{flex:1;overflow-y:auto;padding:14px 18px 24px}
.ci{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci img,.ci .ic{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--panel2);display:grid;place-items:center;color:var(--gold)}
.ci div{flex:1;min-width:0}
.ci b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.ci small{font:600 13px 'Space Grotesk';color:var(--gold-lt)}
.sum{margin-top:14px;display:grid;gap:6px;font-size:14px;color:#d7e2dc}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font:700 20px 'Space Grotesk';color:var(--gold-lt);padding-top:8px;border-top:1px solid var(--line)}
.free{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(212,175,55,.08);font-size:13px;color:var(--gold-lt)}
.free i{height:5px;display:block;margin-top:8px;border-radius:99px;background:linear-gradient(90deg,var(--gold) var(--p),rgba(255,255,255,.1) var(--p))}
.fm{display:grid;gap:10px;margin-top:18px}
.fm h4{font:600 11px 'Space Grotesk';letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.fm label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.fm input,.fm textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(4,20,12,.75);color:#fff;font:inherit;font-size:15px;color-scheme:dark}
.fm input:focus,.fm textarea:focus{outline:0;border-color:var(--gold)}
.fm .bad input,.fm .bad textarea{border-color:var(--bad)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pays label{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;color:#d7e2dc;cursor:pointer}
.pays label:has(input:checked){border-color:var(--gold);background:rgba(212,175,55,.1);color:#fff}
.pays label.off{opacity:.45;cursor:not-allowed}
.pays input{accent-color:var(--gold);width:auto}
.pays small{display:block;font-size:10.5px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;padding:15px;border-radius:16px;font-weight:700;color:#0b0b0b;
  background:linear-gradient(110deg,var(--gold-dk),var(--gold) 35%,var(--gold-lt) 50%,var(--gold) 65%,var(--gold-dk));background-size:200% 100%;animation:shine 5s linear infinite}
.btn:disabled{opacity:.55;animation:none}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;line-height:1.45;color:#d7e2dc;cursor:pointer}
.agree input{flex:none;width:18px;height:18px;margin-top:1px;accent-color:var(--gold)}
.agree.bad{border-color:var(--bad)}
.agree a{color:var(--gold-lt)}
footer .legal{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}
footer .seller{margin-top:8px;font-size:11.5px;line-height:1.5}
.note{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty i{font-size:34px;color:var(--gold);display:block;margin-bottom:10px}
.ok{text-align:center;padding:30px 6px}
.ok>i{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:32px;color:#0b0b0b;background:var(--gold);box-shadow:0 0 0 10px rgba(212,175,55,.12)}
.ok h3{font:700 24px 'Playfair Display',serif}
.ok p{color:#cfe0d6;margin-top:6px}
.ok .no{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--gold);font:700 16px 'Space Grotesk';color:var(--gold-lt)}
.toast{position:fixed;left:50%;top:76px;z-index:30;transform:translate(-50%,-30px);opacity:0;pointer-events:none;background:var(--gold);color:#0b0b0b;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:.3s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
body.lock{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const kmFrom = (lat, lon) => {   // straight-line distance, km
  const rad = x => x * Math.PI / 180, [a, b] = R.place, dLat = rad(lat - a), dLon = rad(lon - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(lat)) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));

function locate(){

}

async function send(){

    store('xs_dme', { name, phone, address });
    cart = {}; store('xs_dcart', cart); lastNo = id.slice(-5).toUpperCase(); view = 'ok';
    drawDrawer(); render();
  } catch(e){ btn.disabled = false; toast(t('sendErr')); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-q],[data-tab],[data-l],#cartBtn,#barOpen,#dClose,#shade,#okMore,#send,#geoBtn'); if (!el) return;
  if (el.id === 'geoBtn'){ locate(); return; }
  const d = el.dataset;
  if (d.q){ const [k, dq] = d.q.split(':'); setQty(k, +dq); return; }
  if (d.tab){ document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === el)); $('c-' + d.tab).scrollIntoView({ behavior: 'smooth' }); el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); return; }
  if (d.l){ lang = d.l; store('xs_dlang', lang); render(); if ($('drawer').classList.contains('on')) drawDrawer(); return; }
  if (el.id === 'cartBtn' || el.id === 'barOpen'){ openDrawer(); return; }
  if (el.id === 'dClose' || el.id === 'shade' || el.id === 'okMore'){ closeDrawer(); return; }
  if (el.id === 'send'){ e.preventDefault(); send(); }
});
document.addEventListener('input', e => {
  const f = e.target.closest('.bad'); if (f) f.classList.remove('bad');
  if (e.target.id === 'fAgree') $('agreeBox').classList.remove('bad');
  if (e.target.id === 'fPhone'){   // +998 XX XXX XX XX
    let d = e.target.value.replace(/\D/g, ''); if (!d.startsWith('998')) d = '998' + d.replace(/^998/, ''); d = d.slice(0, 12);
    e.target.value = '+' + [d.slice(0, 3), d.slice(3, 5), d.slice(5, 8), d.slice(8, 10), d.slice(10, 12)].filter(Boolean).join(' ');
  }
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
// highlight the tab of the category on screen
const spy = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ const id = x.target.id.slice(2);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === id)); } }), { rootMargin: '-140px 0px -60% 0px' });

$('logo').innerHTML = '<img src="../img/logo.webp" alt="Xan Shatir">';
LIVE.pack().catch(() => ({})).then(p => { PACK = p || {}; render(); if ($('drawer').classList.contains('on') && view === 'cart') drawDrawer(); });
render();
</script>
</body>
</html>
