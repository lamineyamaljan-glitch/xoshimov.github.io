<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Xan Shatir — restoran, Chirchiq</title>
<meta name="description" content="Xan Shatir restorani, Chirchiq: yetkazib berish, menyu, stol bron qilish, aloqa.">
<meta name="theme-color" content="#062a1a">
<meta property="og:title" content="Xan Shatir — restoran, Chirchiq">
<meta property="og:description" content="Yetkazib berish · Menyu · Stol bron qilish">
<meta property="og:image" content="https://hoshimov-dev.github.io/nexus/xanshatir/img/beshbarmak.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../fa/all.min.css">
<style>
:root{--gold:#D4AF37;--gold-lt:#F3E5AB;--gold-dk:#997A15;--bg:#04140c;--panel:rgba(10,40,26,.82);--muted:#9fb2a7;--line:rgba(212,175,55,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:#fff;font-family:'Inter',system-ui,sans-serif;line-height:1.45;
  background:radial-gradient(ellipse 120% 50% at 50% -10%,rgba(10,90,54,.8),transparent 60%),radial-gradient(ellipse 80% 40% at 100% 100%,rgba(153,122,21,.16),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:18px 16px 40px}
.gold{background:linear-gradient(110deg,var(--gold-dk),var(--gold) 30%,var(--gold-lt) 50%,var(--gold) 70%,var(--gold-dk));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.top{display:flex;justify-content:space-between;align-items:center}
.open{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(4,20,12,.6)}
.open i{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.15)}
.open.off i{background:#ff8a80;box-shadow:0 0 0 4px rgba(255,138,128,.15)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(4,20,12,.6)}
.lang button{font:600 11px 'Space Grotesk';padding:5px 10px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--gold);color:#0b0b0b}
.hero{text-align:center;padding-top:20px}
.logo{width:118px;height:118px;margin:0 auto 12px;filter:drop-shadow(0 16px 34px rgba(0,0,0,.5))}
.logo img{display:block;width:100%;height:100%}
h1{font:700 30px/1.1 'Cinzel',serif;letter-spacing:.06em}
.sub{margin-top:5px;font:italic 500 16px 'Playfair Display',serif;color:var(--gold-lt)}
.loc{margin-top:4px;font-size:13px;color:var(--muted)}
.loc i{color:var(--gold);margin-right:5px}
.links{display:grid;gap:10px;margin-top:22px}
.lk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);transition:transform .15s}
.lk:active{transform:scale(.98)}
.lk>i{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(212,175,55,.12);color:var(--gold);font-size:18px}
.lk div{flex:1;min-width:0}
.lk b{display:block;font-size:15px;font-weight:600}
.lk small{font-size:12px;color:var(--muted)}
.lk>span{color:var(--gold);font-size:13px}
.lk.main{background:linear-gradient(110deg,var(--gold-dk),var(--gold) 35%,var(--gold-lt) 50%,var(--gold) 65%,var(--gold-dk));background-size:200% 100%;animation:shine 5s linear infinite;border-color:var(--gold);color:#0b0b0b}
.lk.main.in{animation:up .6s cubic-bezier(.2,.8,.2,1) forwards,shine 5s linear infinite}
.lk.main>i{background:#062a1a;color:var(--gold-lt)}
.lk.main small{color:#3a2f0a}
.lk.main>span{color:#062a1a}
.dishes{display:flex;gap:10px;overflow-x:auto;margin:22px -16px 0;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dishes::-webkit-scrollbar{display:none}
.dishes h2{display:none}
.ds{flex:none;width:138px;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.ds img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.ds div{padding:8px 10px 10px}
.ds b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.ds small{font:700 12px 'Space Grotesk';color:var(--gold-lt)}
.ttl{display:flex;align-items:center;gap:10px;margin-top:26px;font:600 11px 'Space Grotesk';letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.ttl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.soc a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:#d7e2dc}
.soc i{font-size:19px;color:var(--gold)}
.hours{margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:14px;font-size:14px}
.hours i{font-size:18px;color:var(--gold)}
.hours small{display:block;font-size:12px;color:var(--muted)}
.legal{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px}
.legal a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.made{display:block;text-align:center;margin-top:28px;font-size:12px;color:var(--muted)}
.made b{font:700 12px 'Space Grotesk';letter-spacing:.2em;margin-left:4px}
.in{opacity:0;transform:translateY(12px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="open" id="open"><i></i><span></span></div><div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div></div>

  <div class="hero in">
    <div class="logo" id="logo"></div>
    <h1><span class="gold">XAN SHATIR</span></h1>
    <div class="sub" data-i="sub"></div>
    <div class="loc"><i class="fa-solid fa-location-dot"></i><span data-i="loc"></span></div>
  </div>

  <div class="links" id="links"></div>

  <div class="ttl" data-i="popular"></div>
  <div class="dishes" id="dishes"></div>

  <div class="ttl" data-i="contact"></div>
  <div class="soc" id="soc"></div>
  <div class="hours"><i class="fa-solid fa-clock"></i><div><b data-i="hoursT"></b><small data-i="hoursS"></small></div></div>

  <div class="legal"><a href="../legal/#oferta" data-i="lOferta"></a><a href="../legal/#privacy" data-i="lPrivacy"></a><a href="../legal/#delivery" data-i="lDelivery"></a></div>
  <a class="made" href="../../ilhom/"><span data-i="made"></span><b class="gold">NEXUS CARD</b></a>
</div>

<script src="../menu.js"></script>
<script>
/* ===== RESTAURANT DATA (change here) ===== */
const R = {
  phone: "+998958378808",
  telegram: "xanshatir",
  instagram: "xanshatir.uz",
  map: "https://yandex.uz/maps/?text=Xan%20Shatir%20Chirchiq",
  hours: [10, 23],
  popular: ["milliy-0", "milliy-1", "milliy-4", "shorva-0", "shashlik-3", "salat-15"]   // dishes shown in the strip, "category-index"
};
/* ========================================= */
const T = {
  uz:{sub:"Chirchiqdagi eng mazali beshbarmoq",loc:"Chirchiq shahri",open:"Hozir ochiq · 23:00 gacha",closed:"Hozir yopiq · 10:00 da ochiladi",
      dl:["Yetkazib berish","Uyga buyurtma bering — issiq holda yetkazamiz"],menu:["Menyu","Barcha taomlar va narxlar"],book:["Stol bron qilish","Bir daqiqada, qo'ng'iroqsiz"],
      call:["Qo'ng'iroq qilish","+998 95 837 88 08"],popular:"Mashhur taomlar",contact:"Aloqa",soc:["Telegram","Instagram","Xarita","Qo'ng'iroq"],
      lOferta:"Ommaviy oferta",lPrivacy:"Maxfiylik siyosati",lDelivery:"Yetkazib berish va qaytarish",hoursT:"Har kuni 10:00–23:00",hoursS:"Yetkazib berish ham shu vaqtda",made:"Sayt:",sum:"so'm"},
  ru:{sub:"Самый вкусный бешбармак в Чирчике",loc:"город Чирчик",open:"Сейчас открыто · до 23:00",closed:"Сейчас закрыто · откроемся в 10:00",
      dl:["Доставка","Закажите домой — привезём горячим"],menu:["Меню","Все блюда и цены"],book:["Забронировать стол","За минуту, без звонков"],
      call:["Позвонить","+998 95 837 88 08"],popular:"Популярные блюда",contact:"Контакты",soc:["Telegram","Instagram","Карта","Звонок"],
      lOferta:"Публичная оферта",lPrivacy:"Политика конфиденциальности",lDelivery:"Доставка и возврат",hoursT:"Ежедневно 10:00–23:00",hoursS:"Доставка в это же время",made:"Сайт:",sum:"сум"}
};
const $ = id => document.getElementById(id);
let lang = (() => { try { return localStorage.getItem('xs_lang') || 'uz'; } catch(e){ return 'uz'; } })();
const dish = key => { const [c, i] = key.split('-'); const m = MENU.find(x => x.id === c); return m && m.items[+i]; };
const fmt = p => p.toLocaleString('ru-RU').replace(/,/g, ' ') + ' ' + T[lang].sum;

function render(){
  const t = T[lang], h = new Date().getHours(), open = h >= R.hours[0] && h < R.hours[1];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t[el.dataset.i]);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('open').classList.toggle('off', !open); $('open').querySelector('span').textContent = open ? t.open : t.closed;
  const L = [['main', '../delivery/', 'fa-motorcycle', t.dl], ['', '../', 'fa-utensils', t.menu], ['', '../#book', 'fa-calendar-check', t.book], ['', 'tel:' + R.phone, 'fa-phone', t.call]];
  $('links').innerHTML = L.map(([c, href, ic, [b, s]], i) => `<a class="lk ${c} in" style="animation-delay:${.1 + i * .06}s" href="${href}"><i class="fa-solid ${ic}"></i><div><b>${b}</b><small>${s}</small></div><span><i class="fa-solid fa-chevron-right"></i></span></a>`).join('');
  $('dishes').innerHTML = R.popular.map(dish).filter(d => d && d.img).map(d => `<a class="ds" href="../delivery/"><img src="../img/${d.img}.webp" alt="${d.n[lang]}" loading="lazy"><div><b>${d.n[lang]}${d.w ? ` (${d.w[lang]})` : ''}</b>${d.p ? `<small>${fmt(d.p)}</small>` : ''}</div></a>`).join('');
  const S = [['fa-brands fa-telegram', 'https://t.me/' + R.telegram], ['fa-brands fa-instagram', 'https://instagram.com/' + R.instagram], ['fa-solid fa-location-dot', R.map], ['fa-solid fa-phone', 'tel:' + R.phone]];
  $('soc').innerHTML = S.map(([ic, href], i) => `<a href="${href}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}><i class="${ic}"></i>${t.soc[i]}</a>`).join('');
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('xs_lang', lang); } catch(e){} render(); });
$('logo').innerHTML = '<img src="../img/logo.webp" alt="Xan Shatir">';
render();
</script>
</body>
</html>
